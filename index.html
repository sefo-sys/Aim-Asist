<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aim-Asist 🎯</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin: 20px 0 5px;
}

#bilgi {
    font-size: 20px;
    margin: 10px;
}

#puan {
    font-size: 28px;
    font-weight: bold;
}

#sure {
    color: #ffcc00;
}

#combo {
    color: #ff4d8d;
    font-size: 22px;
    height: 28px;
}

#hedef {
    position: absolute;
    width: 70px;
    height: 70px;

    background: #ff304f;
    border: 4px solid white;
    border-radius: 50%;

    cursor: pointer;

    box-shadow: 0 0 20px #ff304f;

    transition:
        width 0.15s,
        height 0.15s,
        transform 0.1s;
}

#basla {
    margin-top: 15px;
    padding: 12px 25px;

    border: none;
    border-radius: 10px;

    background: #00c853;
    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

#basla:hover {
    background: #00e676;
}

#sonuc {
    margin-top: 15px;
    font-size: 22px;
}
</style>
</head>

<body>

<h1>🎯 AIM-ASIST</h1>

<div id="bilgi">
    <div id="puan">Puan: 0</div>
    <div>⏱️ Süre: <span id="sure">30</span></div>
</div>

<div id="combo"></div>

<button id="basla">OYUNU BAŞLAT</button>

<div id="sonuc"></div>

<div id="hedef"></div>

<script>

let puan = 0;
let sure = 30;
let combo = 0;
let oyunBasladi = false;
let zamanlayici;

const hedef = document.getElementById("hedef");
const puanYazi = document.getElementById("puan");
const sureYazi = document.getElementById("sure");
const comboYazi = document.getElementById("combo");
const sonuc = document.getElementById("sonuc");
const basla = document.getElementById("basla");


function hedefiTasiyalim() {

    let maxX = window.innerWidth - hedef.offsetWidth;
    let maxY = window.innerHeight - hedef.offsetHeight;

    let x = Math.random() * maxX;
    let y = Math.random() * maxY;

    hedef.style.left = x + "px";
    hedef.style.top = y + "px";
}


function oyunuBaslat() {

    puan = 0;
    sure = 30;
    combo = 0;

    oyunBasladi = true;

    puanYazi.textContent = "Puan: 0";
    sureYazi.textContent = "30";
    comboYazi.textContent = "";
    sonuc.textContent = "";

    hedef.style.display = "block";
    basla.style.display = "none";

    hedef.style.width = "70px";
    hedef.style.height = "70px";

    hedefiTasiyalim();

    zamanlayici = setInterval(function() {

        sure--;

        sureYazi.textContent = sure;

        if (sure <= 0) {
            oyunuBitir();
        }

    }, 1000);
}


function oyunuBitir() {

    clearInterval(zamanlayici);

    oyunBasladi = false;

    hedef.style.display = "none";
    basla.style.display = "inline-block";

    sonuc.textContent =
        "🏆 Oyun bitti! Skorun: " + puan;

    basla.textContent = "TEKRAR OYNA";
}


hedef.onclick = function() {

    if (!oyunBasladi) return;

    puan++;
    combo++;

    puanYazi.textContent =
        "Puan: " + puan;

    comboYazi.textContent =
        "🔥 " + combo + " COMBO!";

    hedefiTasiyalim();

    // Her 5 tıklamada hedef biraz küçülür
    if (puan % 5 === 0) {

        let yeniBoyut =
            Math.max(35, 70 - puan / 2);

        hedef.style.width =
            yeniBoyut + "px";

        hedef.style.height =
            yeniBoyut + "px";
    }

};


basla.onclick = oyunuBaslat;

hedef.style.display = "none";

</script>

</body>
</html>
